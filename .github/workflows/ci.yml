name: OpenGym CI and GHCR
run-name: ${{ github.event_name == 'pull_request' && 'PR verification — NOT DEPLOYED' || github.ref == 'refs/heads/main' && 'Release main — package verified code' || 'Manual verification — no publish' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual validation never publishes; publishing requires a push to main.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    if: github.repository == 'illya228666/openGym' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check deployment transaction without production access
        run: |
          bash -n deploy/opengym-deploy
          bash -n scripts/ci/verify-pr-release.sh
          python3 deploy/test_deploy.py
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            frontend/package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm ci --omit=optional
        working-directory: api
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm ci
        working-directory: mcp
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/OpenGym.Nutrition.Tests/OpenGym.Nutrition.Tests.csproj -c Release
        working-directory: nutrition
      - run: npm test
        working-directory: api
      - run: npm test
        working-directory: frontend
      - run: npm test
        working-directory: mcp
      - run: npm run build
        working-directory: frontend
      - run: node scripts/check-locales.mjs
        working-directory: frontend
      - run: node scripts/check-source-strings.mjs
        working-directory: frontend
      - run: npm run test:fatigue-probe
        working-directory: frontend
      - run: npm run check:node-loadable
        working-directory: mcp
      - run: node api/scripts/check-core-loadable.mjs
      - run: node scripts/build-coach-assets.mjs --check
      - run: node scripts/build-api-docs.mjs --check

  images:
    if: github.repository == 'illya228666/openGym' && github.event_name != 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build API (default target)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./api/Dockerfile
          target: default
          load: true
          tags: opengym-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          labels: org.opencontainers.image.source=https://github.com/illya228666/openGym
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=main-${{ github.sha }}
      - name: Build Web (root context includes api/coach/core)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./web/Dockerfile
          load: true
          tags: opengym-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          labels: org.opencontainers.image.source=https://github.com/illya228666/openGym
          build-args: |
            APP_BUILD=${{ github.sha }}
            VCS_REF=${{ github.sha }}
            VERSION=main-${{ github.sha }}
      - name: Build Nutrition (.NET 10)
        uses: docker/build-push-action@v7
        with:
          context: ./nutrition
          file: ./nutrition/Dockerfile
          load: true
          tags: opengym-nutrition:ci
          cache-from: type=gha,scope=nutrition
          cache-to: type=gha,mode=max,scope=nutrition
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=main-${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Boot all three images and check authentication end to end
        run: |
          docker network create opengym-ci
          docker volume create opengym-ci-nutrition
          docker run -d --name off-fixture --network opengym-ci -v "$PWD/scripts/ci/off-fixture.mjs:/fixture.mjs:ro" node:22-alpine node /fixture.mjs
          docker run -d --name api --network opengym-ci -e DATA_DIR=/data -e PASSWORD_LOGIN=1 -e FIRST_USER_ADMIN=1 -e NUTRITION_URL=http://nutrition:8080 opengym-api:ci
          docker run -d --name nutrition --network opengym-ci -v opengym-ci-nutrition:/data -e OpenGym__ApiBaseUrl=http://api:3000 -e OpenFoodFacts__BaseUrl=http://off-fixture:5099 -e NO_PROXY=api,nutrition,off-fixture,localhost,127.0.0.1 opengym-nutrition:ci
          docker run -d --name web --network opengym-ci -p 127.0.0.1:8080:80 opengym-web:ci
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail http://localhost:8080/api/health
          curl --fail http://localhost:8080/api/config
          curl --fail http://localhost:8080/ > /tmp/opengym.html
          grep -q 'type="module"' /tmp/opengym.html
          docker exec -i api node --input-type=module < scripts/ci/nutrition-internal-smoke.mjs
          node scripts/ci/mcp-smoke.mjs http://localhost:8080 --disposable
          node scripts/ci/nutrition-smoke.mjs http://localhost:8080
          docker rm -f nutrition
          docker run -d --name nutrition --network opengym-ci -v opengym-ci-nutrition:/data -e OpenGym__ApiBaseUrl=http://api:3000 -e OpenFoodFacts__BaseUrl=http://off-fixture:5099 -e NO_PROXY=api,nutrition,off-fixture,localhost,127.0.0.1 opengym-nutrition:ci
          docker exec -i api node --input-type=module < scripts/ci/nutrition-internal-smoke.mjs
          node scripts/ci/nutrition-smoke.mjs http://localhost:8080 --verify-persistence
      - name: Container diagnostics
        if: failure()
        run: |
          docker logs api || true
          docker logs web || true
          docker logs nutrition || true
      # Immutable evidence that the exact checkout completed all tests and smoke checks.
      - name: Attest PR Git tree
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'head=%s\n' "$PR_HEAD"
            printf 'pr=%s\n' "$PR_NUMBER"
          } > verified-pr-tree.txt
      - name: Upload successful PR tree
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: verified-pr-${{ github.event.pull_request.number }}
          path: verified-pr-tree.txt
          if-no-files-found: error
          retention-days: 14
      # PR images are tested but disposable; publishing targets only main-SHA builds.
      - name: Explain release state
        if: success()
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            {
              echo "### ✅ PR checks passed — NOT DEPLOYED"
              echo "All three container images were built and tested, but **not published**."
              echo "**Next step: merge this PR into \`main\`.** Release verifies this exact Git tree, packages it under the main SHA and publishes it without re-running tests."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            {
              echo "### ✅ Main release published to GHCR"
              echo "Images for commit \`$GITHUB_SHA\` are available for automatic Proxmox CD."
              echo "Publication does **not** prove that the server has deployed them; check the deployment status separately."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Development/manual checks passed — no images published" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Clean up smoke containers
        if: always()
        run: |
          docker rm -f web api nutrition off-fixture || true
          docker volume rm opengym-ci-nutrition || true
          docker network rm opengym-ci || true

  # A main push can publish only code whose exact source tree passed complete PR CI.
  # Building again gives the OCI revision labels required by the existing Proxmox CD.
  publish:
    if: github.repository == 'illya228666/openGym' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Gate release on successful PR smoke and identical Git tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/verify-pr-release.sh
      - uses: docker/setup-buildx-action@v4
      - name: Package API (no re-test)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./api/Dockerfile
          target: default
          load: true
          tags: opengym-api:release
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          labels: org.opencontainers.image.source=https://github.com/illya228666/openGym
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=main-${{ github.sha }}
      - name: Package Web (no re-test)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./web/Dockerfile
          load: true
          tags: opengym-web:release
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          labels: org.opencontainers.image.source=https://github.com/illya228666/openGym
          build-args: |
            APP_BUILD=${{ github.sha }}
            VCS_REF=${{ github.sha }}
            VERSION=main-${{ github.sha }}
      - name: Package Nutrition (no re-test)
        uses: docker/build-push-action@v7
        with:
          context: ./nutrition
          file: ./nutrition/Dockerfile
          load: true
          tags: opengym-nutrition:release
          cache-from: type=gha,scope=nutrition
          cache-to: type=gha,mode=max,scope=nutrition
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=main-${{ github.sha }}
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish packages validated by PR
        env:
          SHA: ${{ github.sha }}
        run: |
          for image in api web nutrition; do
            remote="ghcr.io/illya228666/opengym-$image"
            docker tag "opengym-$image:release" "$remote:sha-$SHA"
            docker tag "opengym-$image:release" "$remote:latest"
            docker push "$remote:sha-$SHA"
            docker push "$remote:latest"
          done
      - name: Summarize release
        run: |
          {
            echo "### Verified release published"
            echo "Main \`$GITHUB_SHA\` matches the exact source tree tested by the successful PR."
            echo "No duplicate unit tests or integration smoke were executed."
            echo "All three images are in GHCR; Proxmox deployment is independent."
          } >> "$GITHUB_STEP_SUMMARY"
