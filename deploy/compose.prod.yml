name: opengym

services:
  api:
    image: ghcr.io/illya228666/opengym-api:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      DATA_DIR: /data
      REQUIRE_EXISTING_DATA: "1"
      TRUST_PROXY: "1"
      NUTRITION_URL: http://nutrition:8080
    volumes:
      - type: bind
        source: /opt/opengym/data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /opt/opengym/coach-auth
        target: /coach-auth
        bind:
          create_host_path: false

  nutrition:
    image: ghcr.io/illya228666/opengym-nutrition:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      OpenGym__ApiBaseUrl: http://api:3000
      NO_PROXY: api,nutrition,localhost,127.0.0.1
      Nutrition__DatabasePath: /data/nutrition.db
      Nutrition__RequireExistingDatabase: "true"
    volumes:
      - nutrition-data:/data

  web:
    image: ghcr.io/illya228666/opengym-web:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "8080:80"
    environment:
      NGINX_PORT: "80"
      BACKEND: api
      PORT: "3000"

volumes:
  nutrition-data:
    name: opengym_nutrition-data
    external: true
